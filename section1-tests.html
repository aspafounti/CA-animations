<style>
  :root{--pagebg:#0e0e0d;--ink:#e9e9e6;--muted:#8a8a86;--gold:#FFCC00;--line:#333330}
  *{box-sizing:border-box}
  body{margin:0;background:var(--pagebg);color:var(--ink);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:728px;margin:0 auto;padding:44px 24px 72px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.6}
  .frame{position:relative;width:480px;max-width:100%;height:314px;border-radius:0;overflow:hidden;
    background:#1A1A19}
  .foutline{display:none}
  .stage{position:absolute;top:0;left:0;width:680px;height:560px;transform-origin:top left}
  .menu{position:absolute;inset:0;transform-origin:50% 46%;will-change:transform}
  .band{position:absolute;left:0;width:680px;background-repeat:no-repeat;background-size:680px 560px;will-change:transform}
  .strip{position:absolute;left:0;width:680px;overflow:hidden;background-repeat:no-repeat;background-size:680px 560px;will-change:transform;z-index:5}
  .cursor{position:absolute;top:0;left:0;z-index:40;will-change:transform;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.5))}
  .bar{display:flex;gap:14px;align-items:center;margin-top:16px}
  .replay{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:7px 14px;border-radius:7px;cursor:pointer}
  .replay:hover{color:var(--ink);border-color:#555}
  .speed{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}
  .speed button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer}
  .speed button.on{color:#111;background:var(--gold);border-color:var(--gold);font-weight:700}
  .note{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<div class="wrap">
  <div class="frame"><div class="stage"></div><div class="foutline"></div></div>
</div>

<script>
const CUR='<svg viewBox="0 0 26 32" width="30" height="37"><path d="M2 2 2 24 8 18.5 12 27 15.5 25.5 11.5 17.5 20 17.5 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const IMG=window.__IMG;
const SC=680/565;
const BANDS=[[118,190],[190,289],[289,352]].map(([a,b])=>[Math.round(a*SC),Math.round(b*SC)]);
const BARCUT=90;
const TABW=1083;   // tab bar/card images now render a wider canvas so the peek card isn't clipped

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(lt,a,b)=>clamp((lt-a)/(b-a));
const eOut=t=>1-Math.pow(1-clamp(t),3);      // brake in
const eIn =t=>Math.pow(clamp(t),3);          // accelerate out
const eInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};

const stage=document.querySelector('.stage');
const el={};
(function build(){
  const menu=document.createElement('div');menu.className='menu';stage.appendChild(menu);el.menu=menu;
  el.bands=BANDS.map(([y0,y1])=>{const d=document.createElement('div');d.className='band';
    d.style.top=y0+'px';d.style.height=(y1-y0)+'px';d.style.backgroundPosition='0 '+(-y0)+'px';
    d.style.backgroundImage='url('+IMG.S1+')';menu.appendChild(d);return d;});
  el.bar=document.createElement('div');el.bar.className='strip';el.bar.style.top='0px';el.bar.style.height=BARCUT+'px';
    el.bar.style.width=TABW+'px';el.bar.style.backgroundSize=TABW+'px 560px';
    el.bar.style.backgroundPosition='0 0';stage.appendChild(el.bar);
  el.card=document.createElement('div');el.card.className='strip';el.card.style.top=BARCUT+'px';el.card.style.height=(560-BARCUT)+'px';
    el.card.style.width=TABW+'px';el.card.style.backgroundSize=TABW+'px 560px';
    el.card.style.backgroundPosition='0 '+(-BARCUT)+'px';stage.appendChild(el.card);
  tabsImg('T1');
  el.cur=document.createElement('div');el.cur.className='cursor';el.cur.innerHTML=CUR;stage.appendChild(el.cur);
  // framing reverse-engineered from the Step.svg reference (480x314): card + tab bar
  // measured there, matched back to their coords in this 680x560 stage (non-uniform
  // scale — the reference isn't a plain proportional crop of the old 565x465 design).
  const fit=()=>{const cw=stage.parentElement.clientWidth;
    const k=cw/480;                                    // responsive vs the reference's nominal 480 width
    const sx=0.58718*k, sy=0.60006*k, dx=18.127*k, dy=-10.9105*k;   // nudged up to equalize top/bottom margin (was 17.4/13.5)
    stage.style.transform='translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';};
  fit();new ResizeObserver(fit).observe(stage.parentElement);
})();
function setCursor(x,y){el.cur.style.transform='translate('+x+'px,'+y+'px)';}
function menuState(s){el.bands.forEach((b,i)=>b.style.backgroundImage='url('+IMG[(s==='S2'&&i!==1?'S1':s)]+')');}
function tabsImg(k){el.bar.style.backgroundImage='url('+IMG[k]+')';el.card.style.backgroundImage='url('+IMG[k]+')';}
// menu rows placed with a per-row x offset (px). off<0 = swooped left
function menuAt(off){ // off = base offset applied to Libraries row; rows stagger (lower rows lead)
  el.menu.style.transform='none';
  el.bands.forEach((b,i)=>{ const tilt = off*0.16*(i-1); b.style.transform='translateX('+Math.round(off+tilt)+'px)'; });
}
function tabsAt(barX,cardX){el.bar.style.transform='translateX('+Math.round(barX)+'px)';el.card.style.transform='translateX('+Math.round(cardX)+'px)';}

const REST=[624,51], LIB=[300,275], EXTAB=[300,58];
const OFFL=-960, OFFR=900;   // fully off left / right (wider tab strip needs more clearance)

// ── timeline with holds (seconds) ────────────────────────
const T={
  rest:0.7, glide:1.5, hover:2.05, press:2.22, selHold:2.9,        // menu beats
  trans:3.8,                                                        // menu OUT + tabs IN
  tabsHold:4.7, toEx:5.1, sw:5.57, exHold:7.21,                     // tabs beats (cursor-to-tab move slowed)
  back:8.11, end:8.76                                               // tabs OUT + menu IN, then rest
};
const LOOP=8.76;

function frame(lt){
  // ---------------- MENU ----------------
  if(lt<T.rest){menuState('S1');menuAt(0);tabsAt(OFFR,OFFR);setCursor(...REST);return;}
  if(lt<T.glide){const t=eOut(seg(lt,T.rest,T.glide));setCursor(lerp(REST[0],LIB[0],t),lerp(REST[1],LIB[1],t));
    menuState(seg(lt,T.glide-0.34,T.glide-0.14)>0.5?'S2':'S1');menuAt(0);tabsAt(OFFR,OFFR);return;}
  if(lt<T.hover){menuState('S2');menuAt(0);tabsAt(OFFR,OFFR);setCursor(...LIB);return;}      // HOVER hold
  if(lt<T.press){menuState('S3');setCursor(...LIB);tabsAt(OFFR,OFFR);                        // split-second press (Libraries row only)
    const psc=1-0.03*Math.sin(Math.PI*seg(lt,T.hover,T.press));
    el.bands.forEach((b,i)=>{b.style.transform= i===1 ? 'scale('+psc+')' : 'none';});
    return;}
  if(lt<T.selHold){menuState('S3');menuAt(0);tabsAt(OFFR,OFFR);setCursor(...LIB);return;}    // SELECTED hold (breathe)
  // ---------------- TRANSITION: menu accelerates out, tabs brake in ----------------
  if(lt<T.trans){
    const p=seg(lt,T.selHold,T.trans);
    const ct=eOut(seg(p,0.35,1.0));                                // cursor lingers, then lifts and drifts to rest (brake in, no jump)
    setCursor(lerp(LIB[0],REST[0],ct),lerp(LIB[1],REST[1],ct));
    menuState('S3');
    menuAt(OFFL*eIn(seg(p,0,0.62)));                             // out, accelerate
    tabsImg('T1');
    tabsAt( lerp(OFFR,0,eOut(seg(p,0.28,0.92))),                 // bar arrives, brake
            lerp(OFFR,0,eOut(seg(p,0.42,1.0))) );                // card follows, brake (stagger)
    return;
  }
  // ---------------- TABS hold (My Dashboards) ----------------
  if(lt<T.toEx){menuAt(OFFL);tabsImg('T1');tabsAt(0,0);
    setCursor(...REST);return;}
  if(lt<T.sw){menuAt(OFFL);tabsImg('T1');tabsAt(0,0);                       // cursor to ExTrac
    const t=eOut(seg(lt,T.toEx,T.sw));setCursor(lerp(REST[0],EXTAB[0],t),lerp(REST[1],EXTAB[1],t));return;}
  // ---------------- tab switch (quick, no fade) ----------------
  if(lt<T.exHold){menuAt(OFFL);setCursor(...EXTAB);
    const on=lt>T.sw+0.09; tabsImg(on?'T2':'T1');
    const pop=eOut(seg(lt,T.sw+0.09,T.sw+0.32));
    el.card.style.transform= on?('translateX(0px) scale('+lerp(.985,1,pop)+')'):'translateX(0px)';
    el.card.style.transformOrigin='50% 40%';el.bar.style.transform='translateX(0px)';return;}
  // ---------------- MORPH BACK: tabs accelerate out, menu brakes in ----------------
  if(lt<T.back){
    const p=seg(lt,T.exHold,T.back);
    setCursor(...REST);tabsImg('T2');
    tabsAt( lerp(0,OFFR,eIn(seg(p,0.10,0.72))),                  // bar out, accelerate (stagger)
            lerp(0,OFFR,eIn(seg(p,0,0.62))) );                   // card out first
    menuState('S1');
    menuAt( lerp(OFFL,0,eOut(seg(p,0.34,1.0))) );               // menu brakes back in
    return;
  }
  // ---------------- REST tail -> loop ----------------
  menuState('S1');menuAt(0);tabsAt(OFFR,OFFR);setCursor(...REST);
}

let start=performance.now(), rate=1.17;
function tick(now){let lt=((now-start)/1000/rate)%LOOP; if(window.FREEZE!=null)lt=window.FREEZE; frame(lt); requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script>
