<!-- ============================================================
     ExTrac — "Add to Home / Share with Team" animation
     HubSpot embed snippet
     ============================================================

     STEP 1 — Host the GIF
       HubSpot won't animate a file from your computer. Upload it first:
       Marketing → Files and Templates → Files → Upload  (button-pan-animation.gif)
       Then click the file and copy its URL
       (looks like https://YOURID.hubspotusercontent-na1.net/.../button-pan-animation.gif)

     STEP 2 — Add the HTML
       In the page/email editor, drag in a "Rich text" module (use the </> source view)
       or a "Custom HTML" module, and paste the snippet below.

     STEP 3 — Replace  PASTE_YOUR_HUBSPOT_FILE_URL_HERE  with the copied URL.

     Notes
       • The GIF loops forever on its own — no JavaScript needed.
       • Its corners are transparent, so it sits cleanly on any page colour.
       • It's 1120×711 (2×), shown at up to 560px so it stays crisp on retina.
     ============================================================ -->

<div style="text-align:center; margin:24px auto;">
  <img
    src="PASTE_YOUR_HUBSPOT_FILE_URL_HERE"
    alt="Adding a dashboard to Home and sharing it with your team"
    width="560"
    style="display:inline-block; width:100%; max-width:560px; height:auto; border:0; outline:none;"
    loading="lazy" />
</div>
